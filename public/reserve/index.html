<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>訂位</title><link rel="stylesheet" href="./style.css"></head>
<body><main><header><div class="eyebrow" data-copy="welcome">歡迎光臨</div><div class="title-row"><h1 id="store-name">訂位</h1><div class="preferences"><select id="language" aria-label="Language"><option value="zh-TW">繁體中文</option><option value="en">English</option><option value="ja">日本語</option><option value="zh-CN">简体中文</option></select><select id="style" aria-label="Style"><option value="simple" data-copy="simple">明亮</option><option value="poster" data-copy="poster">海報</option></select></div></div><p data-copy="intro">選好時間，輕鬆來店。</p></header>
<p id="message" role="status" aria-live="polite"></p>
<section id="receipt" hidden aria-labelledby="receipt-title"><div class="eyebrow" data-copy="yourBooking">你的訂位</div><h2 id="receipt-title"></h2><p id="receipt-summary"></p><p id="receipt-person"></p><p id="receipt-note"></p><p id="recovery" hidden data-copy="recovery">店家正在核對還原的資料，請聯絡店家確認。</p><div class="actions"><button id="refresh" data-copy="refresh">重新確認</button><button id="copy-link" data-copy="copy">複製我的訂位連結</button><button id="move" data-copy="move">改時間</button><button id="cancel" data-copy="cancel">取消訂位</button><button id="new" type="button">再訂一筆</button></div><div id="cancel-confirm" hidden><p data-copy="cancelQuestion">確定取消這筆訂位嗎？</p><div class="actions"><button id="cancel-yes" data-copy="cancelYes">確定取消</button><button id="cancel-no" data-copy="keep">保留訂位</button></div></div><p class="caption" data-copy="privateLink">這是你的私人連結，請保存，別分享給其他人。</p></section>
<form id="booking-form" hidden><fieldset id="form-fields"><legend id="form-title" data-copy="choose">選擇日期與人數</legend><div class="fields"><label><span data-copy="party">幾位用餐</span><input id="party" type="number" min="1" max="100" value="2" inputmode="numeric" required></label><label><span data-copy="date">哪一天</span><input id="date" type="date" required></label></div><p id="zone" class="caption"></p><button id="find" type="button" data-copy="find">看看有哪些時間</button><div id="slots" aria-label="Available times"></div><p id="selected" role="status"></p><div id="person-fields"><label><span data-copy="name">怎麼稱呼你</span><input id="name" autocomplete="name" maxlength="100" required></label><label><span data-copy="contact">聯絡電話</span><input id="contact" type="tel" autocomplete="tel" maxlength="100" required></label><details><summary data-copy="noteTitle">有什麼想告訴店家？</summary><textarea id="note" maxlength="1000" rows="3"></textarea></details></div><button id="submit" class="primary" disabled data-copy="submit">確認訂位</button><button id="back" type="button" hidden data-copy="back">返回我的訂位</button></fieldset></form>
<section id="pending" hidden><h2 data-copy="pending">正在確認原訂位</h2><p data-copy="pendingHint">請用原編號重試，不要重新訂一筆。</p><code id="request-id"></code><button id="retry" data-copy="retry">確認原訂位</button></section><footer data-copy="footer">不需登入。訂位保存成功後，店家就會收到。</footer></main><script type="module" src="./app.mjs"></script></body></html>
