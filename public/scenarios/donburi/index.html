<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>丼飯工作台 · POS Pro 情境模板</title>
  <link rel="stylesheet" href="./style.css"><script type="module" src="./app.mjs"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="mark"><span data-i18n="丼">丼</span></span><div>POS Pro<small><span data-i18n="第一個情境模板">第一個情境模板</span></small></div></div>
      <div class="space-label"><span data-i18n="一般丼飯外帶">一般丼飯外帶</span></div>
      <nav aria-label="餐飲工作台" data-i18n-aria-label="餐飲工作台"><button data-view="orders" class="nav-button active"><span data-i18n="接單與出餐">接單與出餐</span></button><button data-view="prep" class="nav-button"><span data-i18n="備料清單">備料清單</span></button><button data-view="stock" class="nav-button"><span data-i18n="原料與進價">原料與進價</span></button><button data-view="report" class="nav-button"><span data-i18n="收攤核對">收攤核對</span></button><button data-view="plan" class="nav-button"><span data-i18n="菜單與試賣設定">菜單與試賣設定</span></button></nav>
      <div class="sidebar-note"><span data-i18n="所有店家">所有店家</span><br><span data-i18n="全部功能免費">全部功能免費</span></div>
    </aside>
    <main>
      <header class="topbar"><div><span class="eyebrow"><span data-i18n="讓一個人，也能顧好每一碗">讓一個人，也能顧好每一碗</span></span><h1 id="page-title"><span data-i18n="接單與出餐">接單與出餐</span></h1></div><label class="date-control"><span data-i18n="試賣日">試賣日</span><input type="date" id="day" aria-label="試賣日期" data-i18n-aria-label="試賣日期"></label></header>
      <div class="demo-banner"><span class="demo-pill"><span data-i18n="試賣演練">試賣演練</span></span><span><span data-i18n="這是示範空間，紀錄與正式 POS 分開。請用測試資料體驗，設定都能調整。">這是示範空間，紀錄與正式 POS 分開。請用測試資料體驗，設定都能調整。</span></span><button id="export" class="small-button"><span data-i18n="匯出演練紀錄">匯出演練紀錄</span></button></div>
      <div id="message" role="status" class="message" hidden></div>
      <section id="metrics" class="metrics" aria-label="今日概況" data-i18n-aria-label="今日概況"></section>
      <section id="content"></section>
      <footer><span data-i18n="範例售價、份量與庫存供試跑；實際營業請換成自己的配方與進價。外部接單與金流尚未串接。">範例售價、份量與庫存供試跑；實際營業請換成自己的配方與進價。外部接單與金流尚未串接。</span></footer>
    </main>
  </div>
  <dialog id="payment-dialog"><form id="payment-form"><h2><span data-i18n="核對實際收到的款項">核對實際收到的款項</span></h2><p id="payment-description"></p><label><span data-i18n="付款方式">付款方式</span><select name="method"><option value="cash"><span data-i18n="現金">現金</span></option><option value="transfer"><span data-i18n="轉帳（人工核對）">轉帳（人工核對）</span></option><option value="electronic"><span data-i18n="電子付款（人工核對）">電子付款（人工核對）</span></option></select></label><label><span data-i18n="實收金額">實收金額</span><input name="amount" type="number" min="0" step="0.01" required></label><p class="hint"><span data-i18n="轉帳與電子付款須先自行核對入帳，再按確認。">轉帳與電子付款須先自行核對入帳，再按確認。</span></p><div class="dialog-actions"><button type="button" data-close="payment-dialog" class="secondary-button"><span data-i18n="返回">返回</span></button><button class="primary-button"><span data-i18n="確認實收">確認實收</span></button></div></form></dialog>
  <dialog id="cancel-dialog"><form id="cancel-form"><h2><span data-i18n="核對取消與退款">核對取消與退款</span></h2><p id="cancel-description"></p><div class="dialog-actions"><button type="button" data-close="cancel-dialog" class="secondary-button"><span data-i18n="返回">返回</span></button><button class="danger-button" id="cancel-confirm"><span data-i18n="確認取消">確認取消</span></button></div></form></dialog>
</body>
</html>
